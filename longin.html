<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: aliceblue;
            font-family: 'roboto',sans-serif;
        }
        .signup-box{
            width: 360px;
            height: 620px;
            margin: auto;
            background-color: white;
            border-radius: 3px;
        }
        .Login-box{
            width: 360px;
            height: 270px;
            margin: auto;
            border-radius: 3px;
            background-color: white;
        }
        h1{
            text-align: center;
            padding: top;
        }
        form{
            width: 300px;
            margin-left: 20px;
        }
        form label{
            display: flex;

        }
        form input{
            width: 100%;
            padding: 7px;
            border: none;
            border: 1px solid gray;
            border-radius: 6px;

        }
        input[type="button"]{

            background-color: #ff9800;

        .aasu-2{
            text-align: center;
            color: black;

            margin-top: -40px;
        }

            color: #49a1c2;
        }
    </style>
</head>
<body>
    <div class="Login-box">
        <h1>Login</h1>
        <form>
            <label>Gmail or phone number</label>
            <input type="email" placeholder="">
            <label>Password</label>
