<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JD SHOP</title>
    <style>
        body{
            background-color: aliceblue;
            font-family: 'roboto',sans-serif;
        }
        .signup-box{
            width: 360px;
            height: 620px;
            margin: auto;
            background-color: white;
            border-radius: 3px;
        }
        h1{
            text-align: center;
            padding: top;
        }
        form{
            width: 300px;
            margin-left: 20px;
        }
        form label{
            display: flex;
            margin-top: 20px;
            font-size: 18px;
        }
        form input{
            width: 100%;
            padding: 7px;
            border: none;
            border: 1px solid gray;
            border-radius: 6px;
            outline: none;
        }
        input[type="button"]{
            width: 320px;
            height: 35px;
            margin-top: 20px;
            border: none;
            background-color: #ff9800;
            font-size: 20px;

        }
        p{
            text-align: center;
            padding-top: 20px;
            font-size: 15px;
        }
        .aasu-2{
            text-align: center;
            color: black;
            font-size: 15px;
            margin-top: -80px;
        }
        .aasu-2 a{
            color: #49a1c2;
        }
    </style>
</head>
<body>
    <div class="signup-box">
    <h1>Sign Up</h1>
    <form>
    <label>First Name</label>
    <input type="text" placeholder="First Name">
    <label>Last Name</label>
    <input type="text" placeholder="Last Name">
    <label>Enter gmail</label>
    <input type="text" placeholder="Enter Gmail">
    <label>phone number</label>
    <input type="text" placeholder="Enter phone">
    <label>Password</label>
    <input type="text" placeholder="">
    <label>Confirm Password</label>
    <input type="text" placeholder="">
    <input type="button" value="Sumbit">
    </form>
    </div>
    <p class="aasu-2">Already Have account <a href="longin.html">Long In Here</a></p>
</body>
</html>
